# Fly.io — optional alternative to Railway
# Usage: fly launch && fly volumes create trading_data --size 1 --region nrt
#        fly deploy

app = "altcoin-trading"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  DEPLOYMENT_MODE = "cloud"
  DATA_DIR = "/data"
  DATABASE_PATH = "/data/trading.db"
  NGROK_ENABLED = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[mounts]
  source = "trading_data"
  destination = "/data"
