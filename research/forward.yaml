# Forward (paper) tests of what survived the confirmatory layers. Paper only, no orders.
registered: 2026-09-27
tests:
  - id: F1_upbit_krw_listing
    source: [E1b (2025-03..2026-09 pass), B3_E1b_2024 (2024 holdout pass)]
    object: scripts/upbit_listing_watcher.py (launchd com.altcoin.upbitlisting)
    rule: poll Upbit announcements ~1/s; new KRW listing with a live Binance USDT perp -> paper long at the Binance best ask at detection; exit at best bid +15m and +60m
    measures: detection lag vs first_listed_at (the key unknown), realised net at +15m/+60m
    decision: after >= 15 listings, keep only if median detection lag <= 1.5 s AND mean net60 > 0; warning - 2026 median at +2 s was already negative
    secondary: delisting notices -> paper short (B2_N2), same logging
  - id: F2_pump_cnn
    source: [B2_M7_pump (2026 test +0.75%/trade), B3_M7_pump_2024 (+0.58%), 6-seed check (12/12 positive)]
    object: scripts/pump_cnn_paper.py with frozen data/models/pump_cnn (launchd com.altcoin.pumpcnn, minute 2 hourly)
    rule: every +10% hour (24h volume >= $2M, >= 72h listed); 6-seed mean probability; long >= Dec-2025 70th pct, short <= 30th; hold 4h
    decision: after >= 300 paper trades (about 6-8 weeks), keep only if mean net > 0 with day-clustered 95% CI above 0
  - id: F3_crash_rebound
    registered: 2026-09-27
    source: [B6_3 crash_rebound_L meta-label pass (post-hoc), C1 rule in research/batch_C1.yaml]
    object: scripts/crash_rebound_paper.py (launchd com.altcoin.crashrebound, minute 3 hourly)
    rule: coin 24h <= -25%, BTC 24h <= -3%, close below prior 30d closing low, 24h vol >= $2M, >= 72h listed -> paper long; entry open T+60s, exit open T+60s+24h; 24h cooldown per coin
    also_logged: crashes that fail the BTC or 30d-low filter (control arm, side=0)
    decision: rare events (market-wide crashes), so review after >= 30 trades or 6 months; keep only if mean net > 0 with day-clustered CI above 0 AND beats the control arm
  - id: F4_short_spot_led_pumps
    registered: 2026-09-28
    source: [B11_2 (post-hoc reversal: long spot-led +10% pumps lost 1.9%/24h in discovery AND holdout, CI below 0 in both)]
    object: scripts/spot_led_paper.py (launchd com.altcoin.spotled, minute 4 hourly)
    rule: >
      hour T close: Binance perp 1h return >= +10%, 24h quote volume >= $2M, >= 72h listed, 24h cooldown per coin;
      S1 = spot quote-volume share of (spot + perp) over the last 6h minus the same share over the last 168h (Binance REST klines);
      S1 >= 0.01999 (discovery top-tercile threshold, frozen) -> paper SHORT perp at the open of the minute T+60s, exit open T+60s+24h;
      pumps with S1 < 0.01999 or no spot market are logged as control (side 0) with the same hypothetical short outcome
    costs: 0.05%/side fee + volume slippage; funding added at settlement from the funding table (shorts receive positive funding)
    decision: after >= 100 shorts (about 3 months): keep only if mean net > 0 with day-clustered 95% CI above 0 AND beats the control arm
  - id: F5_short_into_unlocks
    registered: 2026-09-28
    source: [B9_1 (+1.25% disc n=200, +1.34% holdout n=137, beats placebo in both; CI crossed 0)]
    object: scripts/unlock_short_paper.py (launchd com.altcoin.unlockshort, minute 6 hourly; refreshes DefiLlama emissions daily)
    rule: >
      cliff unlock (DefiLlama emissions metadata.events unlockType=cliff) of >= 1% of circulating supply (circulating = cumulative
      documented unlocked the day before), coin has a Binance USDT perp; same-day events summed; open paper SHORT at the first hourly run
      at or after unlock time - 72h (skip if already later than unlock - 60h), exit at unlock + 24h
    decision: after >= 60 trades (about 4-6 months): keep only if mean net > 0 with day-clustered CI above 0

F6_oi_drop_short:
  registered: 2026-09-28
  source: B17_F04 oi_drop3|s5|t4h (validation +0.78%/trade CI [0.58,0.97], discovery +0.37% CI [0.11,0.62], 6,732 + 10,005 trades, all regimes positive)
  rule: after a live pump onset (close/close_60m_ago - 1 >= +10%, dv24 >= $2M, >= 72h listed, 6h cooldown per coin), track 5-minute open interest;
        when OI falls 3% below its post-onset high (within 24h), SHORT at the next minute close; exit at +4h or a 5% hard stop (+0.2% slippage past the stop);
        cost 0.05%/side + liquidity slippage; paper only.
  sample_size: 100 events minimum before any verdict; stop date 2026-11-15 (whichever first)
  pass: mean net > 0 with day-clustered CI > 0; MAE p90 < 8%; no regime with mean < -0.5%
  implementation: scripts/oi_drop_short_paper.py (launchd com.altcoin.oidropshort, every 5 min; OI polled from Binance REST); table oi_drop_short_paper; started 2026-09-28
  amended_2026-09-28: backtest stop re-simulated on real minute highs -> validation +0.39%/trade CI [0.19,0.58], discovery +0.16% CI [-0.10,0.41] (edge
        halved; F04 close-only stop was optimistic). Pass criteria unchanged. Settle now fills gap-opens above the stop at the open. Sizing for any
        later live use (B17_F10): 10% notional per trade, max 3 concurrent. F08: no regime filter.
  amended_2026-09-29: SOURCE INVALIDATED. The backtest used Vision metrics OI stamped ~5 min before it was measured (look-ahead).
        With correct timing the rule loses (validation -0.22%, discovery -0.32%). The live service uses real-time OI, so the forward
        result is honest but is now expected to be negative. Keep only as a check, or stop it.

main_book:
  started: 2026-09-28 (after the paper portfolio reset to 1,000 USDT; backup data/backups/paper_reset_20260928_2344)
  chosen_by: 유리 - main paper book trades F2 (pump CNN) + F6 (oi-drop short) only; signal_xs, core hold and pump rider disabled in .env
  object: scripts/main_book.py (launchd com.altcoin.mainbook, every 60 s); strategies f2_pump_cnn / f6_oi_short in paper_trades; state main_book_map
  sizing: B17_F10 - 10% of equity per trade, max 3 open; entries at the latest 1-minute close when first seen (<= 15 min after the planned entry)
  note: the F2/F6 forward-test tables stay the clean evidence; the main book adds execution delay and the position cap. PAPER ONLY, LIVE_TRADING=false.
  amended_2026-10-01: >
    Admission is now rule-based. A strategy enters the main book only after its own forward test passes its registered
    decision rule (>= 300 closed paper trades, mean net > 0, day-clustered 95% CI above 0) and is then admitted at full
    size automatically. The only brake is downside: equity 10% below its running peak pauses new entries for 7 days.
    F2 is at 21/300, so the main book holds cash until then. F6 stays out (source invalidated).

