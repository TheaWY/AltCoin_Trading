<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AltCoin Trading · Home</title>
  <style>
    :root {
      --bg:#05070b; --panel:#0f141c; --panel2:#151b24; --line:#252d3a;
      --text:#eef3f8; --muted:#8a94a3; --red:#f04452; --blue:#2878ff;
      --green:#2fd27d; --amber:#f0b84f;
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.35}.app{max-width:560px;margin:0 auto;min-height:100vh;padding:12px 12px 84px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.title{font-size:18px;font-weight:900}.status{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.dot.live{background:var(--green)}.section{margin-bottom:14px}.section-title{margin:0 0 8px 2px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}.hero{padding:14px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px}.hero-main{font-size:22px;font-weight:950}.hero-sub{margin-top:5px;color:var(--muted);font-size:12.5px}.banner{padding:11px 14px;font-size:12.5px;font-weight:850;border-left:3px solid var(--amber);background:rgba(240,184,79,.08);color:var(--amber)}.banner.risk_off{border-color:var(--blue);background:rgba(40,120,255,.10);color:#93c5fd}.card{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.06)}.card:last-child{border-bottom:0}.card-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.coin{font-weight:900;font-size:15px}.price{margin-left:auto;text-align:right;font-weight:850}.sub{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:650}.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:950;border:1px solid transparent}.pill.short{color:#93c5fd;background:rgba(40,120,255,.14);border-color:rgba(40,120,255,.24)}.pill.long{color:#fca5a5;background:rgba(240,68,82,.12);border-color:rgba(240,68,82,.22)}.pill.hold{color:var(--muted);background:rgba(138,148,163,.12);border-color:rgba(138,148,163,.22)}.pill.scalp{color:var(--amber);background:rgba(240,184,79,.13);border-color:rgba(240,184,79,.24)}.pill.swing{color:var(--green);background:rgba(47,210,125,.12);border-color:rgba(47,210,125,.22)}.tag{height:20px;padding:2px 7px;border-radius:5px;background:rgba(138,148,163,.12);color:var(--muted);font-size:10.5px;font-weight:850}.conf{height:20px;padding:2px 7px;border-radius:5px;background:rgba(138,148,163,.12);color:var(--muted);font-size:10.5px;font-weight:900}.conf.hi{background:rgba(47,210,125,.13);color:var(--green)}.conf.mid{background:rgba(240,184,79,.13);color:var(--amber)}.reason{margin-top:7px;font-size:13px;font-weight:700;color:#d7e0ea}.why{margin:7px 0 0;padding-left:16px;color:var(--muted);font-size:12.5px}.why li{margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{display:inline-flex;gap:4px;height:22px;align-items:center;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--muted);font-size:11px;font-weight:750}.chip b{color:var(--text)}.pos{color:var(--red)}.neg{color:var(--blue)}.muted{color:var(--muted)}.empty{padding:18px;color:var(--muted);text-align:center}.more{width:100%;padding:13px;border:0;background:var(--panel2);color:var(--muted);font-size:13px;font-weight:900}.bottom{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,1fr);gap:1px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(5,7,11,.94);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.bottom a{height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:950}.bottom a.active{background:var(--panel2);color:var(--text)}
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="title">AltCoin Trading</div>
      <div class="status"><span class="dot" id="dot"></span><span id="status">연결 중</span></div>
    </div>

    <section class="section">
      <div class="hero">
        <div class="hero-main" id="headline">데이터 대기 중</div>
        <div class="hero-sub" id="subline">Home은 진입 판단만 보여줍니다. 전체 마켓 테이블은 숨겼습니다.</div>
      </div>
    </section>

    <section class="section" id="regime-section" style="display:none">
      <div class="panel banner" id="regime"></div>
    </section>

    <section class="section" id="positions-section" style="display:none">
      <div class="section-title">내 포지션</div>
      <div class="panel" id="positions"></div>
    </section>

    <section class="section">
      <div class="section-title">지금 진입 가능</div>
      <div class="panel" id="tradable"><div class="empty">평가 대기 중</div></div>
    </section>

    <section class="section">
      <div class="section-title">대기 — 왜 안 들어가는지</div>
      <div class="panel" id="waiting"><div class="empty">평가 대기 중</div></div>
    </section>
  </main>

  <nav class="bottom">
    <a class="active" href="/dashboard">홈</a>
    <a href="/dashboard/full#portfolio">포트폴리오</a>
    <a href="/dashboard/full#method">전략</a>
    <a href="/experiments">실험</a>
  </nav>

  <script>
    const KRW_RATE=1400, $=id=>document.getElementById(id), num=v=>Number(v??0);
    const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const usd=v=>v==null?'—':'$'+num(v).toLocaleString(undefined,{maximumFractionDigits:num(v)>=10?2:4});
    const pct=v=>v==null?'—':`${num(v)>=0?'+':''}${num(v).toFixed(2)}%`;
    const fx=(v,d=1)=>v==null?'—':num(v).toFixed(d);
    const tone=v=>num(v)>0?'pos':num(v)<0?'neg':'muted';
    const pill=v=>`<span class="pill ${(v||'hold').toLowerCase()}">${esc(v||'HOLD')}</span>`;
    const stylePill=s=>s==='단타'?'<span class="pill scalp">단타</span>':s==='스윙'?'<span class="pill swing">스윙</span>':'<span class="pill hold">대기</span>';
    const conf=s=>s==null?'':`<span class="conf ${s>=.7?'hi':s>=.55?'mid':''}">확신 ${Math.round(num(s)*100)}%</span>`;
    const chip=(k,v,c='')=>`<span class="chip">${esc(k)} <b class="${c}">${esc(v)}</b></span>`;
    let shown={tradable:30,waiting:30}, last=null;

    function chips(m){
      const dv=m.dollar_volume_24h;
      return [
        chip('RSI',fx(m.rsi_14,0)), chip('ATR',fx(m.atr_pct,2)+'%'),
        chip('펀딩',m.funding_rate_pct==null?'—':pct(m.funding_rate_pct),tone(m.funding_rate_pct)),
        chip('7d',pct(m.pct_7d),tone(m.pct_7d)), chip('BTC상관',fx(m.btc_correlation,2)),
        chip('거래대금',dv==null?'—':'$'+(dv/1e6).toFixed(0)+'M')
      ].join('');
    }
    function card(e,{showWhy=false}={}){
      const m=e.metrics||{}, v=e.verdict, inv=e.investment||{}, invested=e.has_position;
      const why=showWhy&&e.why_not?.length?`<ul class="why">${e.why_not.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:'';
      const reason=v?`<div class="reason">${esc(v.reason)}</div>`:'';
      const investedLine=invested?`<div class="reason">보유중 · ${pill(inv.direction)} 진입 ${usd(inv.entry_price)} · <span class="${tone(inv.unrealized_pnl_pct)}">${pct(inv.unrealized_pnl_pct)}</span></div>`:'';
      return `<div class="card"><div class="card-head"><span class="coin">${esc(e.base||e.symbol)}</span>${invested?pill(inv.direction):''}${v?stylePill(v.style):showWhy?stylePill(null):''}${v?pill(v.direction):''}${v?`<span class="tag">${esc(v.strategy)}</span>`:''}${v?conf(v.score):conf(e.confidence)}<span class="price">${usd(m.last_price)}<span class="sub ${tone(m.pct_24h)}">${pct(m.pct_24h)} 24h</span></span></div>${investedLine}${!invested?reason:''}${why}<div class="chips">${chips(m)}</div></div>`;
    }
    function section(el, rows, key, opts){
      let html=rows.slice(0,shown[key]).map(e=>card(e,opts)).join('');
      if(rows.length>shown[key]) html+=`<button class="more" data-more="${key}">더 보기 (${rows.length-shown[key]}개 남음)</button>`;
      el.innerHTML=html||'<div class="empty">없음</div>';
    }
    function render(data){
      last=data;
      const ev=data.evaluation||[];
      const invested=ev.filter(e=>e.has_position);
      const tradable=ev.filter(e=>!e.has_position&&e.tradable);
      const waiting=ev.filter(e=>!e.has_position&&!e.tradable);
      const policy=data.direction_policy||{};
      $('headline').innerHTML=`진입 가능 <b>${tradable.length+invested.filter(e=>e.tradable).length}</b> / ${ev.length}`;
      $('subline').textContent=`보유 ${invested.length} · 대기 ${waiting.length}`+(policy.allow_long===false?' · 롱 금지':'')+' · Market 탭 숨김';
      const reg=data.regime||{};
      if(reg.reason){$('regime-section').style.display='';$('regime').className='panel banner '+(reg.state||'');$('regime').textContent=reg.reason;} else {$('regime-section').style.display='none';}
      if(invested.length){$('positions-section').style.display='';section($('positions'),invested,'tradable',{showWhy:false});} else {$('positions-section').style.display='none';}
      section($('tradable'),tradable,'tradable',{showWhy:false});
      section($('waiting'),waiting,'waiting',{showWhy:true});
      $('dot').className='dot live'; $('status').textContent=data.health?.status==='ok'?'Live':'Live';
    }
    document.addEventListener('click',e=>{const k=e.target?.dataset?.more;if(!k||!last)return;shown[k]+=60;render(last);});
    async function load(){try{const r=await fetch('/api/alts');render(await r.json());}catch{$('dot').className='dot';$('status').textContent='Offline';}}
    load(); setInterval(load,30000);
  </script>
</body>
</html>
