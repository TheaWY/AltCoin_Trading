<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AltCoin Trading · Home</title>
  <style>
    :root{--bg:#05070b;--panel:#0f141c;--panel2:#151b24;--line:#252d3a;--text:#eef3f8;--muted:#8a94a3;--red:#f04452;--blue:#2878ff;--green:#2fd27d;--amber:#f0b84f;--purple:#a78bfa}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.35}.app{max-width:560px;margin:0 auto;min-height:100vh;padding:12px 12px 84px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.title{font-size:18px;font-weight:900}.status{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.dot.live{background:var(--green)}.section{margin-bottom:14px}.section-title{margin:0 0 8px 2px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}.hero{padding:14px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px}.hero-main{font-size:22px;font-weight:950}.hero-sub{margin-top:5px;color:var(--muted);font-size:12.5px}.banner{padding:11px 14px;font-size:12.5px;font-weight:850;border-left:3px solid var(--amber);background:rgba(240,184,79,.08);color:var(--amber)}.banner.risk_off{border-color:var(--blue);background:rgba(40,120,255,.10);color:#93c5fd}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}.kpi .label{display:block;color:var(--muted);font-size:11px;font-weight:850}.kpi .value{display:block;margin-top:4px;font-size:17px;font-weight:950}.kpi .note{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:650}.mini{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.06)}.mini:last-child{border-bottom:0}.mini-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.mini-title{font-weight:900}.mini-sub{color:var(--muted);font-size:12px;margin-top:3px}.card{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.06)}.card:last-child{border-bottom:0}.card-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.coin{font-weight:900;font-size:15px}.price{margin-left:auto;text-align:right;font-weight:850}.sub{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:650}.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:950;border:1px solid transparent}.pill.short{color:#93c5fd;background:rgba(40,120,255,.14);border-color:rgba(40,120,255,.24)}.pill.long{color:#fca5a5;background:rgba(240,68,82,.12);border-color:rgba(240,68,82,.22)}.pill.hold{color:var(--muted);background:rgba(138,148,163,.12);border-color:rgba(138,148,163,.22)}.pill.scalp{color:var(--amber);background:rgba(240,184,79,.13);border-color:rgba(240,184,79,.24)}.pill.swing{color:var(--green);background:rgba(47,210,125,.12);border-color:rgba(47,210,125,.22)}.tag{height:20px;padding:2px 7px;border-radius:5px;background:rgba(138,148,163,.12);color:var(--muted);font-size:10.5px;font-weight:850}.conf{height:20px;padding:2px 7px;border-radius:5px;background:rgba(138,148,163,.12);color:var(--muted);font-size:10.5px;font-weight:900}.conf.hi{background:rgba(47,210,125,.13);color:var(--green)}.conf.mid{background:rgba(240,184,79,.13);color:var(--amber)}.reason{margin-top:7px;font-size:13px;font-weight:700;color:#d7e0ea}.why{margin:7px 0 0;padding-left:16px;color:var(--muted);font-size:12.5px}.why li{margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{display:inline-flex;gap:4px;height:22px;align-items:center;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--muted);font-size:11px;font-weight:750}.chip b{color:var(--text)}.pos{color:var(--red)}.neg{color:var(--blue)}.good{color:var(--green)}.warn{color:var(--amber)}.muted{color:var(--muted)}.empty{padding:18px;color:var(--muted);text-align:center}.more{width:100%;padding:13px;border:0;background:var(--panel2);color:var(--muted);font-size:13px;font-weight:900}.bottom{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,1fr);gap:1px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(5,7,11,.94);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.bottom a{height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:950}.bottom a.active{background:var(--panel2);color:var(--text)}@keyframes tickup{0%{background:rgba(240,68,82,.32);box-shadow:0 0 0 1px rgba(240,68,82,.55) inset}100%{background:transparent;box-shadow:none}}@keyframes tickdown{0%{background:rgba(40,120,255,.32);box-shadow:0 0 0 1px rgba(40,120,255,.55) inset}100%{background:transparent;box-shadow:none}}.tick-up{animation:tickup .45s ease-out;border-radius:4px}.tick-down{animation:tickdown .45s ease-out;border-radius:4px}
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar"><div class="title">AltCoin Trading</div><div class="status"><span class="dot" id="dot"></span><span id="status">연결 중</span></div></div>
    <section class="section"><div class="hero"><div class="hero-main" id="headline">데이터 대기 중</div><div class="hero-sub" id="subline">Home은 포트폴리오 · 전략 · 실험 · 진입 판단을 한 화면에 보여줍니다.</div></div></section>
    <section class="section" id="regime-section" style="display:none"><div class="panel banner" id="regime"></div></section>

    <section class="section" id="portfolio-section">
      <div class="section-title">포트폴리오</div>
      <div class="grid" id="portfolio-grid"></div>
    </section>

    <section class="section" id="strategy-section">
      <div class="section-title">전략 설정</div>
      <div class="panel" id="strategy-panel"><div class="empty">전략 정보 대기 중</div></div>
    </section>

    <section class="section" id="experiments-section">
      <div class="section-title">실험 / 검증</div>
      <div class="panel" id="experiments-panel"><div class="empty">실험 정보 대기 중</div></div>
    </section>

    <section class="section" id="positions-section" style="display:none"><div class="section-title">내 포지션</div><div class="panel" id="positions"></div></section>
    <section class="section"><div class="section-title">지금 진입 가능</div><div class="panel" id="tradable"><div class="empty">평가 대기 중</div></div></section>
    <section class="section"><div class="section-title">대기 — 왜 안 들어가는지</div><div class="panel" id="waiting"><div class="empty">평가 대기 중</div></div></section>
  </main>
  <nav class="bottom"><a class="active" href="/dashboard">홈</a><a href="/dashboard/full#portfolio">포트폴리오</a><a href="/dashboard/full#method">전략</a><a href="/experiments">실험</a></nav>
  <script>
    const KRW_RATE=1400,$=id=>document.getElementById(id),num=v=>Number(v??0);
    const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const usd=v=>v==null?'—':'$'+num(v).toLocaleString(undefined,{maximumFractionDigits:num(v)>=10?2:4});
    const krw=v=>v==null?'—':'₩'+Math.round(num(v)*KRW_RATE).toLocaleString('ko-KR');
    const pct=v=>v==null?'—':`${num(v)>=0?'+':''}${num(v).toFixed(2)}%`;
    const fx=(v,d=1)=>v==null?'—':num(v).toFixed(d), tone=v=>num(v)>0?'pos':num(v)<0?'neg':'muted';
    const pill=v=>`<span class="pill ${(v||'hold').toLowerCase()}">${esc(v||'HOLD')}</span>`;
    const stylePill=s=>s==='단타'?'<span class="pill scalp">단타</span>':s==='스윙'?'<span class="pill swing">스윙</span>':'<span class="pill hold">대기</span>';
    const conf=s=>s==null?'':`<span class="conf ${s>=.7?'hi':s>=.55?'mid':''}">확신 ${Math.round(num(s)*100)}%</span>`;
    const chip=(k,v,c='')=>`<span class="chip">${esc(k)} <b class="${c}">${esc(v)}</b></span>`;
    let shown={tradable:30,waiting:30},last=null,liveWs=null,watchKey='';
    const lastCloses=new Map();

    function symId(symbol){return String(symbol||'').replace('/','').toUpperCase();}
    function setStatus(live,label){$('dot').className='dot'+(live?' live':'');$('status').textContent=label||(live?'Live':'Offline');}
    function chips(m){const dv=m.dollar_volume_24h;return [chip('RSI',fx(m.rsi_14,0)),chip('ATR',fx(m.atr_pct,2)+'%'),chip('펀딩',m.funding_rate_pct==null?'—':pct(m.funding_rate_pct),tone(m.funding_rate_pct)),chip('7d',pct(m.pct_7d),tone(m.pct_7d)),chip('BTC상관',fx(m.btc_correlation,2)),chip('거래대금',dv==null?'—':'$'+(dv/1e6).toFixed(0)+'M')].join('');}
    function card(e,{showWhy=false}={}){const m=e.metrics||{},v=e.verdict,inv=e.investment||{},invested=e.has_position,sid=symId(e.symbol);const why=showWhy&&e.why_not?.length?`<ul class="why">${e.why_not.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:'';const reason=v?`<div class="reason">${esc(v.reason)}</div>`:'';const investedLine=invested?`<div class="reason">보유중 · ${pill(inv.direction)} 진입 ${usd(inv.entry_price)} · <span class="${tone(inv.unrealized_pnl_pct)}">${pct(inv.unrealized_pnl_pct)}</span></div>`:'';return `<div class="card"><div class="card-head"><span class="coin">${esc(e.base||e.symbol)}</span>${invested?pill(inv.direction):''}${v?stylePill(v.style):showWhy?stylePill(null):''}${v?pill(v.direction):''}${v?`<span class="tag">${esc(v.strategy)}</span>`:''}${v?conf(v.score):conf(e.confidence)}<span class="price"><span data-tick="${sid}">${usd(m.last_price)}</span><span class="sub ${tone(m.pct_24h)}" data-tick-pct="${sid}">${pct(m.pct_24h)} 24h</span></span></div>${investedLine}${!invested?reason:''}${why}<div class="chips">${chips(m)}</div></div>`;}
    function section(el,rows,key,opts){let html=rows.slice(0,shown[key]).map(e=>card(e,opts)).join('');if(rows.length>shown[key])html+=`<button class="more" data-more="${key}">더 보기 (${rows.length-shown[key]}개 남음)</button>`;el.innerHTML=html||'<div class="empty">없음</div>';}

    function kpi(label,value,note='',cls='') {return `<div class="kpi"><span class="label">${esc(label)}</span><span class="value ${cls}">${value}</span>${note?`<span class="note">${esc(note)}</span>`:''}</div>`;}
    function renderPortfolio(data){const p=data.portfolio||{};const value=p.paper_value??p.starting_capital;const start=p.starting_capital;const pnl=p.pnl_vs_start;const pnlPct=start?num(pnl)/num(start)*100:null;$('portfolio-grid').innerHTML=[
      kpi('현재 평가금',`${krw(value)} <span class="note">${usd(value)}</span>`,'USDT 기준 KRW 환산'),
      kpi('시작 자본',`${krw(start)} <span class="note">${usd(start)}</span>`,'목표: ₩1,000,000'),
      kpi('손익',`${usd(pnl)} / ${pct(pnlPct)}`,'시작 자본 대비',tone(pnl)),
      kpi('오픈 포지션',`${p.open_trades??0}/${p.max_open_positions??'—'}`,`투입 ${usd(p.total_invested_open||0)}`)
    ].join('');}
    function renderStrategy(data){const s=data.strategy_config||{},policy=data.direction_policy||{},stats=data.strategy_stats||{};const rows=[
      ['방향 정책',`${policy.allow_long===false?'롱 금지 · ':''}${policy.allow_short?'숏 허용':'숏 금지'}`],
      ['확신/비용',`min confidence ${fx((s.min_confidence??0.7)*100,0)}% · round trip ${fx(s.round_trip_cost_pct,2)}%`],
      ['리스크',`risk/trade ${fx(s.risk_per_trade_pct,1)}% · max position ${fx(s.max_position_pct,0)}% · max ${s.max_open_positions??'—'}개`],
      ['손절/익절',`SL ${fx(s.atr_stop_mult,1)} ATR · TP ${fx(s.atr_tp_mult,1)} ATR · trail ${fx(s.trail_atr_mult,1)} ATR`],
      ['필터',`min volume $${fx(s.min_dollar_volume_m,0)}M · min ATR ${fx(s.min_atr_pct,2)}%`],
      ['전략 통계',Object.keys(stats).length?`${Object.keys(stats).length} strategies tracked`:'아직 통계 없음']
    ];$('strategy-panel').innerHTML=rows.map(([k,v])=>`<div class="mini"><div class="mini-row"><span class="mini-title">${esc(k)}</span><span class="muted">${esc(v)}</span></div></div>`).join('');}
    function renderExperiments(data){const r=data.research||{},ex=r.experiments||{},hist=r.history||{},tot=ex.totals||{},stage=hist.capital_stage||{};const rows=[
      ['실험 상태',`done ${tot.done||0} · queued ${tot.queued||0} · running ${tot.running||0} · failed ${tot.failed||0}`],
      ['자본 단계',`${stage.stage||'paper'} → ${stage.next_stage||'—'} · ${stage.progress_pct??0}%`],
      ['승격 준비',stage.promote_ready?'가능':'아직 부족'],
      ['최근 데이터',hist.data_verdict?.status||'대기']
    ];$('experiments-panel').innerHTML=rows.map(([k,v])=>`<div class="mini"><div class="mini-row"><span class="mini-title">${esc(k)}</span><span class="muted">${esc(v)}</span></div></div>`).join('');}

    function render(data){last=data;const ev=data.evaluation||[],invested=ev.filter(e=>e.has_position),tradable=ev.filter(e=>!e.has_position&&e.tradable),waiting=ev.filter(e=>!e.has_position&&!e.tradable),policy=data.direction_policy||{};$('headline').innerHTML=`진입 가능 <b>${tradable.length+invested.filter(e=>e.tradable).length}</b> / ${ev.length}`;$('subline').textContent=`보유 ${invested.length} · 대기 ${waiting.length} · 추적 ${data.symbols_tracked||ev.length}`+(policy.allow_long===false?' · 롱 금지':'')+' · 가격은 실시간 tick';renderPortfolio(data);renderStrategy(data);renderExperiments(data);const reg=data.regime||{};if(reg.reason){$('regime-section').style.display='';$('regime').className='panel banner '+(reg.state||'');$('regime').textContent=reg.reason;}else{$('regime-section').style.display='none';}if(invested.length){$('positions-section').style.display='';section($('positions'),invested,'tradable',{showWhy:false});}else{$('positions-section').style.display='none';}section($('tradable'),tradable,'tradable',{showWhy:false});section($('waiting'),waiting,'waiting',{showWhy:true});setStatus(true,data.health?.status==='ok'?'Live':'Live');sendWatchList();}
    function sendWatchList(){if(!liveWs||liveWs.readyState!==WebSocket.OPEN)return;const symbols=[...new Set([...document.querySelectorAll('[data-tick]')].map(el=>el.dataset.tick))].sort();const key=symbols.join(',');if(key===watchKey)return;watchKey=key;liveWs.send(JSON.stringify({type:'watch',symbols}));}
    function flash(el,cls){el.classList.remove('tick-up','tick-down');void el.offsetWidth;el.classList.add(cls);}
    function applyTick(sym,close,pct24){document.querySelectorAll(`[data-tick="${sym}"]`).forEach(el=>{const prev=lastCloses.get(sym);el.textContent=usd(close);if(prev!=null&&close!==prev)flash(el,close>prev?'tick-up':'tick-down');});lastCloses.set(sym,close);if(pct24!=null){document.querySelectorAll(`[data-tick-pct="${sym}"]`).forEach(el=>{el.textContent=pct(pct24)+' 24h';el.className='sub '+tone(pct24);});}}
    function onPrices(msg){const data=msg.data||{};Object.keys(data).forEach(sym=>{const [close,pct24]=data[sym];applyTick(sym,close,pct24);});setStatus(true,'● 실시간');}
    function connectWs(){const protocol=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${protocol}://${location.host}/ws`);ws.onopen=()=>{liveWs=ws;watchKey='';setStatus(true,'Live');sendWatchList();};ws.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==='prices'){onPrices(msg);return;} if(msg.type==='snapshot')render(msg);}catch{}};ws.onclose=()=>{if(liveWs===ws)liveWs=null;setStatus(false,'Offline');setTimeout(connectWs,3000);};ws.onerror=()=>setStatus(false,'Offline');}
    document.addEventListener('click',e=>{const k=e.target?.dataset?.more;if(!k||!last)return;shown[k]+=60;render(last);});
    async function load(){try{const r=await fetch('/api/alts');render(await r.json());}catch{setStatus(false,'Offline');}}
    load();connectWs();setInterval(load,60000);
  </script>
</body>
</html>
