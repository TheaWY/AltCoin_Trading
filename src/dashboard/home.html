<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AltCoin Trading · Home</title>
  <style>
    :root{--bg:#05070b;--panel:#0f141c;--panel2:#151b24;--line:#252d3a;--text:#eef3f8;--muted:#8a94a3;--red:#f04452;--blue:#2878ff;--green:#2fd27d;--amber:#f0b84f}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.35}.app{max-width:560px;margin:0 auto;min-height:100vh;padding:12px 12px 90px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.title{font-size:18px;font-weight:900}.status{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.dot.live{background:var(--green)}.section{margin-bottom:14px;scroll-margin-top:12px}.section-title{margin:0 0 8px 2px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.panel,.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.hero{padding:14px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px}.hero-main{font-size:22px;font-weight:950}.hero-sub{margin-top:5px;color:var(--muted);font-size:12.5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi{padding:11px 12px}.kpi .label{display:block;color:var(--muted);font-size:11px;font-weight:850}.kpi .value{display:block;margin-top:4px;font-size:17px;font-weight:950}.kpi .note{display:block;margin-top:3px;color:var(--muted);font-size:11px}.mini,.card{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.06)}.mini:last-child,.card:last-child{border-bottom:0}.mini-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.mini-title{font-weight:900}.mini-sub{color:var(--muted);font-size:12px;margin-top:3px}.card-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.coin{font-weight:900;font-size:15px}.price{margin-left:auto;text-align:right;font-weight:850}.sub{display:block;margin-top:2px;color:var(--muted);font-size:11px}.pill,.tag,.conf,.chip{display:inline-flex;align-items:center;border-radius:999px;font-size:11px;font-weight:900}.pill{min-width:44px;height:22px;padding:0 8px;border:1px solid transparent}.pill.short{color:#93c5fd;background:rgba(40,120,255,.14)}.pill.long{color:#fca5a5;background:rgba(240,68,82,.12)}.pill.hold{color:var(--muted);background:rgba(138,148,163,.12)}.pill.scalp{color:var(--amber);background:rgba(240,184,79,.13)}.pill.swing{color:var(--green);background:rgba(47,210,125,.12)}.tag,.conf{height:20px;padding:2px 7px;border-radius:5px;background:rgba(138,148,163,.12);color:var(--muted);font-size:10.5px}.tag.allowed,.conf.hi{background:rgba(47,210,125,.13);color:var(--green)}.tag.blocked{background:rgba(240,68,82,.12);color:#fca5a5}.conf.mid{background:rgba(240,184,79,.13);color:var(--amber)}.reason{margin-top:7px;font-size:13px;font-weight:700;color:#d7e0ea}.why{margin:7px 0 0;padding-left:16px;color:var(--muted);font-size:12.5px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{gap:4px;height:22px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--muted);font-weight:750}.chip b{color:var(--text)}.pos{color:var(--red)}.neg{color:var(--blue)}.good{color:var(--green)}.warn{color:var(--amber)}.muted{color:var(--muted)}.empty{padding:18px;color:var(--muted);text-align:center}.more{width:100%;padding:13px;border:0;background:var(--panel2);color:var(--muted);font-size:13px;font-weight:900}.bottom{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,1fr);gap:1px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(5,7,11,.94);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.bottom a{height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:950}.bottom a.active{background:var(--panel2);color:var(--text)}
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar"><div class="title">AltCoin Trading</div><div class="status"><span class="dot" id="dot"></span><span id="status">연결 중</span></div></div>
    <section class="section" id="top"><div class="hero"><div class="hero-main" id="headline">데이터 대기 중</div><div class="hero-sub" id="subline">Home에서 포트폴리오 · 전략 · 실험 · 진입 판단을 한 화면에 봅니다.</div></div></section>
    <section class="section" id="regime-section" style="display:none"><div class="panel" id="regime"></div></section>
    <section class="section" id="portfolio-section"><div class="section-title">포트폴리오</div><div class="grid" id="portfolio-grid"></div></section>
    <section class="section"><div class="section-title">진입 퍼널</div><div class="panel" id="entry-funnel"><div class="empty">퍼널 대기 중</div></div></section>
    <section class="section" id="strategy-section"><div class="section-title">전략 설정</div><div class="panel" id="strategy-panel"><div class="empty">전략 정보 대기 중</div></div></section>
    <section class="section" id="experiments-section"><div class="section-title">실험 / 카테고리</div><div class="panel" id="experiments-panel"><div class="empty">실험 정보 대기 중</div></div></section>
    <section class="section" id="positions-section" style="display:none"><div class="section-title">내 포지션</div><div class="panel" id="positions"></div></section>
    <section class="section" id="tradable-section"><div class="section-title">지금 진입 가능</div><div class="panel" id="tradable"><div class="empty">평가 대기 중</div></div></section>
    <section class="section" id="waiting-section"><div class="section-title">대기 — 왜 안 들어가는지</div><div class="panel" id="waiting"><div class="empty">평가 대기 중</div></div></section>
  </main>
  <nav class="bottom"><a class="active" href="#top">홈</a><a href="#portfolio-section">포트폴리오</a><a href="#strategy-section">전략</a><a href="/experiments">실험</a></nav>
<script>
const KRW_RATE=1400,$=id=>document.getElementById(id),num=v=>Number(v??0);
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const usd=v=>v==null?'—':'$'+num(v).toLocaleString(undefined,{maximumFractionDigits:num(v)>=10?2:4});
const krw=v=>{if(v==null)return'—';const n=Math.round(num(v)*KRW_RATE),sign=n<0?'-':'';return sign+'₩'+Math.abs(n).toLocaleString('ko-KR');};
const pct=v=>v==null?'—':`${num(v)>=0?'+':''}${num(v).toFixed(2)}%`;
const fx=(v,d=1)=>v==null?'—':num(v).toFixed(d), tone=v=>num(v)>0?'pos':num(v)<0?'neg':'muted';
const dirLabel=v=>v==='LONG'?'상승':v==='SHORT'?'하락':(v||'대기');
const pill=v=>`<span class="pill ${(v||'hold').toLowerCase()}">${esc(dirLabel(v))}</span>`;
const stylePill=s=>s==='단타'?'<span class="pill scalp">단타</span>':s==='스윙'?'<span class="pill swing">스윙</span>':'<span class="pill hold">대기</span>';
const conf=s=>s==null?'':`<span class="conf ${s>=.7?'hi':s>=.55?'mid':''}">확신 ${Math.round(num(s)*100)}%</span>`;
const chip=(k,v,c='')=>`<span class="chip">${esc(k)} <b class="${c}">${esc(v)}</b></span>`;
let shown={tradable:30,waiting:30},last=null,categoryMap={},categorySummary=null,liveWs=null,watchKey='';
function symId(symbol){return String(symbol||'').replace('/','').toUpperCase();}
function setStatus(live,label){$('dot').className='dot'+(live?' live':'');$('status').textContent=label||(live?'Live':'Offline');}
function categoryTag(symbol){const c=categoryMap[symbol];if(!c)return '<span class="tag">cat: pending</span>';return `<span class="tag ${c.trade_allowed?'allowed':'blocked'}" title="${esc(c.reason||'')}">${esc(c.category||'unknown')}</span>`;}
function chips(m,c){const dv=m.dollar_volume_24h,cat=c?.features||{};return [chip('RSI',fx(m.rsi_14,0)),chip('ATR',fx(m.atr_pct,2)+'%'),chip('펀딩',m.funding_rate_pct==null?'—':pct(m.funding_rate_pct),tone(m.funding_rate_pct)),chip('7d',pct(m.pct_7d),tone(m.pct_7d)),chip('BTC상관',fx(m.btc_correlation,2)),chip('거래대금',dv==null?'—':'$'+(dv/1e6).toFixed(0)+'M'),chip('30mBurst',fx(Math.max(cat.tick_notional_ratio||0,cat.tick_trade_ratio||0),1))].join('');}
function card(e,{showWhy=false}={}){const m=e.metrics||{},v=e.verdict,inv=e.investment||{},invested=e.has_position,cat=categoryMap[e.symbol];const why=showWhy&&e.why_not?.length?`<ul class="why">${e.why_not.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:'';const reason=v?`<div class="reason">${esc(v.reason)}</div>`:'';const investedLine=invested?`<div class="reason">보유중 · ${pill(inv.direction)} 진입 ${usd(inv.entry_price)} · <span class="${tone(inv.unrealized_pnl_pct)}">${pct(inv.unrealized_pnl_pct)}</span></div>`:'';return `<div class="card"><div class="card-head"><span class="coin">${esc(e.base||e.symbol)}</span>${categoryTag(e.symbol)}${invested?pill(inv.direction):''}${v?stylePill(v.style):showWhy?stylePill(null):''}${v?pill(v.direction):''}${v?`<span class="tag">${esc(v.strategy)}</span>`:''}${v?conf(v.score):conf(e.confidence)}<span class="price"><span data-tick="${symId(e.symbol)}">${usd(m.last_price)}</span><span class="sub ${tone(m.pct_24h)}" data-tick-pct="${symId(e.symbol)}">${pct(m.pct_24h)} 24h</span></span></div>${investedLine}${!invested?reason:''}${cat&&!cat.trade_allowed?`<div class="mini-sub">카테고리 필터: ${esc(cat.reason||'blocked')}</div>`:''}${why}<div class="chips">${chips(m,cat)}</div></div>`;}
function section(el,rows,key,opts){let html=rows.slice(0,shown[key]).map(e=>card(e,opts)).join('');if(rows.length>shown[key])html+=`<button class="more" data-more="${key}">더 보기 (${rows.length-shown[key]}개 남음)</button>`;el.innerHTML=html||'<div class="empty">없음</div>';}
function kpi(label,value,note='',cls=''){return `<div class="kpi"><span class="label">${esc(label)}</span><span class="value ${cls}">${value}</span>${note?`<span class="note">${esc(note)}</span>`:''}</div>`;}
function renderPortfolio(data){const p=data.portfolio||{},value=p.equity??p.paper_value??p.starting_capital,start=p.starting_capital,pnl=p.pnl_vs_start,pnlPct=start?num(pnl)/num(start)*100:null;$('portfolio-grid').innerHTML=[kpi('현재 평가금 / Equity',`${krw(value)} <span class="note">${usd(value)}</span>`,'가용 현금 + 오픈 평가금'),kpi('가용 현금',`${krw(p.available_cash??p.cash)} <span class="note">${usd(p.available_cash??p.cash)}</span>`,'예약 증거금과 분리 표시'),kpi('손익',`${usd(pnl)} / ${pct(pnlPct)}`,'시작 자본 대비',tone(pnl)),kpi('오픈 포지션',`${p.open_trades??0}/${p.max_open_positions??'—'}`,`평가 ${usd(p.open_position_value??p.total_open_value||0)} · 예약 ${usd(p.reserved_margin??p.total_invested_open||0)}`)].join('');}
function renderEntryFunnel(data){const f=data.entry_funnel||{};if(!Object.keys(f).length){$('entry-funnel').innerHTML='<div class="empty">퍼널 대기 중</div>';return;}const items=[['평가',f.symbols_evaluated],['신선도차단',f.blocked_freshness],['셋업',f.setups_fired],['방향정책',f.killed_direction_policy],['확신미달',f.below_min_confidence],['최고확신',f.max_confidence_seen==null?'—':pct(num(f.max_confidence_seen)*100)],['레짐',f.blocked_regime],['카테고리',f.blocked_category],['쿨다운',f.in_cooldown],['진입',f.entered]];$('entry-funnel').innerHTML=items.map(([k,v])=>`<div class="mini"><div class="mini-row"><span class="mini-title">${esc(k)}</span><span class="muted">${esc(v??0)}</span></div></div>`).join('');}
function renderStrategy(data){const s=data.strategy_config||{},policy=data.direction_policy||{},stats=data.strategy_stats||{};const longTxt=policy.allow_long?'상승 포지션 허용':'상승 포지션 보류',shortTxt=policy.allow_short?'하락 포지션 허용':'하락 포지션 보류',holdTxt=policy.long_term_hold_enabled?'장투 허용':'장투 금지';const rows=[['방향/보유 정책',`${longTxt} · ${shortTxt} · ${holdTxt}`],['확신/비용',`min confidence ${fx((s.min_confidence??0.7)*100,0)}% · round trip ${fx(s.round_trip_cost_pct,2)}%`],['리스크',`risk/trade ${fx(s.risk_per_trade_pct,1)}% · max position ${fx(s.max_position_pct,0)}% · max ${s.max_open_positions??'—'}개`],['필터',`min volume $${fx(s.min_dollar_volume_m,0)}M · min ATR ${fx(s.min_atr_pct,2)}%`],['전략 통계',Object.keys(stats).length?`${Object.keys(stats).length} strategies tracked`:'아직 통계 없음']];$('strategy-panel').innerHTML=rows.map(([k,v])=>`<div class="mini"><div class="mini-row"><span class="mini-title">${esc(k)}</span><span class="muted">${esc(v)}</span></div></div>`).join('');}
function renderExperiments(data){const r=data.research||{},ex=r.experiments||{},report=r.report||{},budget=report.budget||{},hist=r.history||{},tot=ex.totals||{},stage=hist.capital_stage||{},cs=categorySummary||{},next=(report.recommended_narrowed_space?.next_candidates||[]).length;const rows=[['실험 상태',`${report.completed_analysis_label||'완료 분석 대기'} · queued ${tot.queued||0} · running ${tot.running||0} · failed ${tot.failed||0}`],['예산 가드',`${budget.reason||'확인 중'} · ${budget.tried??'—'}/${budget.budget??'—'} · next ${next}`],['다음 안전 행동',budget.next_safe_action||'완료 실험 분석 후 후보 축소'],['자본 단계',`${stage.stage||'paper'} → ${stage.next_stage||'—'} · ${stage.progress_pct??0}%`],['카테고리',`${cs.trade_allowed??0}/${cs.symbols??0} tradable · age ${cs.age_seconds==null?'—':Math.round(cs.age_seconds/60)+'m'}`]];$('experiments-panel').innerHTML=rows.map(([k,v])=>`<div class="mini"><div class="mini-row"><span class="mini-title">${esc(k)}</span><span class="muted">${esc(v)}</span></div></div>`).join('');}
function render(data){last=data;const ev=data.evaluation||[],invested=ev.filter(e=>e.has_position),tradable=ev.filter(e=>!e.has_position&&e.tradable&&(categoryMap[e.symbol]?.trade_allowed!==false)),waiting=ev.filter(e=>!e.has_position&&!tradable.includes(e));$('headline').innerHTML=`진입 가능 <b>${tradable.length}</b> / ${ev.length}`;$('subline').textContent=`보유 ${invested.length} · 대기 ${waiting.length} · 추적 ${data.symbols_tracked||ev.length} · category-aware`;renderPortfolio(data);renderEntryFunnel(data);renderStrategy(data);renderExperiments(data);const reg=data.regime||{};if(reg.reason){$('regime-section').style.display='';$('regime').innerHTML=`<div class="mini">${esc(reg.reason)}</div>`;}else{$('regime-section').style.display='none';}if(invested.length){$('positions-section').style.display='';section($('positions'),invested,'tradable',{showWhy:false});}else{$('positions-section').style.display='none';}section($('tradable'),tradable,'tradable',{showWhy:false});section($('waiting'),waiting,'waiting',{showWhy:true});setStatus(true,data.health?.status==='ok'?'Live':'Live');sendWatchList();}
function sendWatchList(){if(!liveWs||liveWs.readyState!==WebSocket.OPEN)return;const symbols=[...new Set([...document.querySelectorAll('[data-tick]')].map(el=>el.dataset.tick))].sort();const key=symbols.join(',');if(key===watchKey)return;watchKey=key;liveWs.send(JSON.stringify({type:'watch',symbols}));}
function applyTick(sym,close,pct24){document.querySelectorAll(`[data-tick="${sym}"]`).forEach(el=>{el.textContent=usd(close);});if(pct24!=null){document.querySelectorAll(`[data-tick-pct="${sym}"]`).forEach(el=>{el.textContent=pct(pct24)+' 24h';el.className='sub '+tone(pct24);});}}
function connectWs(){const protocol=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${protocol}://${location.host}/ws`);ws.onopen=()=>{liveWs=ws;watchKey='';setStatus(true,'Live');sendWatchList();};ws.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==='prices'){Object.keys(msg.data||{}).forEach(sym=>{const [close,pct24]=msg.data[sym];applyTick(sym,close,pct24);});setStatus(true,'● 실시간');return;} if(msg.type==='snapshot')render(msg);}catch{}};ws.onclose=()=>{if(liveWs===ws)liveWs=null;setStatus(false,'Offline');setTimeout(connectWs,3000);};}
document.addEventListener('click',e=>{const k=e.target?.dataset?.more;if(k&&last){shown[k]+=60;render(last);}});
async function load(){try{const [alts,cats,cs]=await Promise.all([fetch('/api/alts').then(r=>r.json()),fetch('/api/research/categories/latest').then(r=>r.json()).catch(()=>({categories:{}})),fetch('/api/research/categories/summary').then(r=>r.json()).catch(()=>null)]);categoryMap=cats.categories||{};categorySummary=cs;render(alts);}catch(e){setStatus(false,'API 실패');}}
load();connectWs();setInterval(load,60000);
</script>
</body>
</html>
