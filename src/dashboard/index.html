<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AltCoin Trading</title>
  <style>
    :root {
      --bg: #05070b;
      --panel: #0f141c;
      --panel-2: #151b24;
      --line: #252d3a;
      --text: #eef3f8;
      --muted: #8a94a3;
      --up: #f04452;
      --down: #2878ff;
      --green: #2fd27d;
      --amber: #f0b84f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.35;
    }
    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 12px 12px 86px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .title { font-size: 18px; font-weight: 850; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--up);
    }
    .dot.live { background: var(--green); }
    .tab-page { display: none; }
    .tab-page.active { display: block; }
    .section { margin-bottom: 14px; }
    .section-title {
      margin: 0 0 8px 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .summary {
      padding: 16px 14px 14px;
      background: var(--panel-2);
    }
    .summary-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }
    .summary-total {
      margin-top: 3px;
      font-size: 30px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .summary-pnl {
      margin-top: 5px;
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
      border-top: 1px solid var(--line);
    }
    .metric {
      min-width: 0;
      padding: 11px 12px;
      background: var(--panel);
    }
    .metric-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .metric-value {
      margin-top: 4px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .market-line {
      padding: 13px 14px;
      font-weight: 850;
      color: #dfe7f0;
    }
    .scroll-table {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }
    .market-table { min-width: 700px; }
    th, td {
      padding: 10px 9px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    th {
      color: var(--muted);
      background: #0a0e14;
      font-size: 11px;
      font-weight: 850;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      text-align: left;
    }
    th:first-child { background: #0a0e14; }
    td:first-child { background: var(--panel); }
    tr.hot td { background: rgba(47,210,125,.08); }
    tr.hot td:first-child { background: #112119; }
    .coin { font-weight: 850; }
    .sub {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid transparent;
    }
    .pill.long { color: var(--up); background: rgba(240,68,82,.12); border-color: rgba(240,68,82,.22); }
    .pill.short { color: var(--down); background: rgba(40,120,255,.14); border-color: rgba(40,120,255,.24); }
    .pill.none, .pill.hold { color: var(--muted); background: rgba(138,148,163,.12); border-color: rgba(138,148,163,.22); }
    .pill.scalp { color: var(--amber); background: rgba(240,184,79,.13); border-color: rgba(240,184,79,.24); }
    .pill.swing { color: var(--green); background: rgba(47,210,125,.12); border-color: rgba(47,210,125,.22); }
    .pos { color: var(--up); }
    .neg { color: var(--down); }
    .muted { color: var(--muted); }
    .empty {
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }
    .bottom-tabs {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: 100%;
      max-width: 520px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      background: rgba(5,7,11,.94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .tab-btn {
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
    }
    .tab-btn.active {
      background: var(--panel-2);
      color: var(--text);
    }
    @media (max-width: 380px) {
      .app { padding-left: 10px; padding-right: 10px; }
      .summary-total { font-size: 25px; }
      th, td { padding-left: 7px; padding-right: 7px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="title">AltCoin Trading</div>
      <div class="status"><span class="dot" id="ws-dot"></span><span id="ws-text">연결 중</span></div>
    </div>

    <section class="tab-page active" id="tab-portfolio">
      <div class="section">
        <div class="panel">
          <div class="summary">
            <div class="summary-label">총 평가금액</div>
            <div class="summary-total" id="total-value">—</div>
            <div class="summary-pnl" id="total-pnl">—</div>
          </div>
          <div class="metrics">
            <div class="metric">
              <div class="metric-label">보유 KRW</div>
              <div class="metric-value" id="cash-value">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">총 매수금액</div>
              <div class="metric-value" id="buy-amount">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">오픈 포지션</div>
              <div class="metric-value" id="open-count">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">BTC 보유 대비</div>
              <div class="metric-value" id="btc-compare">—</div>
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Open Positions</div>
        <div class="panel scroll-table">
          <table>
            <thead>
              <tr>
                <th>코인</th>
                <th>방향</th>
                <th>매수평균</th>
                <th>현재가</th>
                <th>평가손익</th>
                <th>수익률</th>
              </tr>
            </thead>
            <tbody id="positions-body">
              <tr><td colspan="6" class="empty">오픈 포지션 없음</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Recent Closed Trades</div>
        <div class="panel scroll-table">
          <table>
            <thead>
              <tr>
                <th>코인</th>
                <th>방향</th>
                <th>진입가</th>
                <th>청산가</th>
                <th>수익률</th>
                <th>보유</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <tr><td colspan="6" class="empty">청산 내역 없음</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="tab-page" id="tab-market">
      <div class="section">
        <div class="section-title">Market Summary</div>
        <div class="panel market-line" id="market-summary">데이터 대기 중</div>
      </div>
      <div class="section">
        <div class="section-title">All Symbols</div>
        <div class="panel scroll-table">
          <table class="market-table">
            <thead>
              <tr>
                <th>코인</th>
                <th>현재가</th>
                <th>24h</th>
                <th>펀딩비</th>
                <th>신호</th>
                <th>추천</th>
                <th>Conf</th>
              </tr>
            </thead>
            <tbody id="market-body">
              <tr><td colspan="7" class="empty">마켓 데이터 없음</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-tabs" aria-label="Dashboard tabs">
    <button class="tab-btn active" type="button" data-tab="portfolio">포트폴리오</button>
    <button class="tab-btn" type="button" data-tab="market">마켓</button>
  </nav>

  <script>
    const KRW_RATE = 1400;
    const $ = id => document.getElementById(id);
    const num = value => Number(value ?? 0);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
    const krw = value => value == null ? '—' : '₩' + Math.round(num(value) * KRW_RATE).toLocaleString('ko-KR');
    const usd = value => value == null ? '—' : '$' + num(value).toLocaleString(undefined, { maximumFractionDigits: value >= 10 ? 2 : 4 });
    const pct = value => value == null ? '—' : `${num(value) >= 0 ? '+' : ''}${num(value).toFixed(2)}%`;
    const tone = value => num(value) > 0 ? 'pos' : num(value) < 0 ? 'neg' : 'muted';
    const confidence = value => value == null ? '—' : Math.round(num(value) * 100) + '%';

    function setLive(isLive, label) {
      $('ws-dot').className = 'dot' + (isLive ? ' live' : '');
      $('ws-text').textContent = label || (isLive ? 'Live' : 'Offline');
    }

    function pill(value) {
      const text = value || 'NONE';
      return `<span class="pill ${text.toLowerCase()}">${esc(text)}</span>`;
    }

    function recPill(alt) {
      if (!alt.worth_investing || !alt.recommended_style) {
        return '<span class="pill hold">HOLD</span>';
      }
      const isShort = alt.recommended_style === 'short_term';
      return `<span class="pill ${isShort ? 'scalp' : 'swing'}">${isShort ? '단타' : '스윙'}</span>`;
    }

    function renderPortfolio(data) {
      const p = data.portfolio || {};
      const start = p.starting_capital ?? 0;
      const value = p.paper_value ?? null;
      const pnl = p.pnl_vs_start ?? (value == null ? null : value - start);
      const pnlPct = start ? pnl / start * 100 : null;
      const btcHold = p.buy_and_hold_value ?? null;
      const btcDiff = p.pnl_vs_buy_hold ?? (value != null && btcHold != null ? value - btcHold : null);
      const btcDiffPct = btcHold ? btcDiff / btcHold * 100 : null;

      $('total-value').textContent = krw(value);
      $('total-pnl').className = 'summary-pnl ' + tone(pnl);
      $('total-pnl').textContent = `${pct(pnlPct)} · ${krw(pnl)} 평가손익`;
      $('cash-value').textContent = krw(p.cash);
      $('buy-amount').textContent = krw(p.total_invested_open);
      $('open-count').textContent = `${p.open_trades ?? 0} / ${p.max_open_positions ?? '—'}`;
      $('btc-compare').className = 'metric-value ' + tone(btcDiff);
      $('btc-compare').textContent = btcDiff == null ? '—' : `${pct(btcDiffPct)} · ${krw(btcDiff)}`;
    }

    function renderPositions(data) {
      const rows = (data.alts || []).filter(alt => alt.investment?.status === 'open');
      if (!rows.length) {
        $('positions-body').innerHTML = '<tr><td colspan="6" class="empty">오픈 포지션 없음</td></tr>';
        return;
      }
      $('positions-body').innerHTML = rows.map(alt => {
        const inv = alt.investment || {};
        return `
          <tr>
            <td><span class="coin">${esc(alt.base || alt.symbol)}</span><span class="sub">${esc(alt.symbol)}</span></td>
            <td>${pill(inv.direction)}</td>
            <td>${usd(inv.entry_price)}</td>
            <td>${usd(inv.current_price ?? alt.price)}</td>
            <td class="${tone(inv.unrealized_pnl)}">${krw(inv.unrealized_pnl)}</td>
            <td class="${tone(inv.unrealized_pnl_pct)}">${pct(inv.unrealized_pnl_pct)}</td>
          </tr>
        `;
      }).join('');
    }

    function tradeReturn(trade) {
      const notional = num(trade.entry_price) * num(trade.quantity);
      return notional ? num(trade.pnl) / notional * 100 : null;
    }

    function holdTime(trade) {
      if (!trade.opened_at || !trade.closed_at) return '—';
      const hours = Math.max(0, num(trade.closed_at) - num(trade.opened_at)) / 3600;
      return hours < 24 ? `${hours.toFixed(1)}h` : `${(hours / 24).toFixed(1)}d`;
    }

    function renderHistory(data) {
      const trades = (data.closed_trades || data.recent_trades || [])
        .filter(trade => trade.status === 'closed')
        .sort((a, b) => num(b.closed_at) - num(a.closed_at))
        .slice(0, 20);
      if (!trades.length) {
        $('history-body').innerHTML = '<tr><td colspan="6" class="empty">청산 내역 없음</td></tr>';
        return;
      }
      $('history-body').innerHTML = trades.map(trade => {
        const ret = tradeReturn(trade);
        return `
          <tr>
            <td><span class="coin">${esc((trade.symbol || '').split('/')[0])}</span></td>
            <td>${pill(trade.direction)}</td>
            <td>${usd(trade.entry_price)}</td>
            <td>${usd(trade.exit_price)}</td>
            <td class="${tone(ret)}">${pct(ret)}</td>
            <td>${holdTime(trade)}</td>
          </tr>
        `;
      }).join('');
    }

    function renderMarketSummary(data) {
      const alts = data.alts || [];
      const positive = alts.filter(alt => num(alt.funding_rate) > 0).length;
      const negative = alts.filter(alt => num(alt.funding_rate) < 0).length;
      const bias = positive > negative ? '롱 우세' : negative > positive ? '숏 우세' : '중립';
      const btc = alts.find(alt => alt.symbol === 'BTC/USDT') || {};
      const spikes = alts.filter(alt => alt.volume_spike).length;
      $('market-summary').textContent = `${bias} ${positive}/${alts.length} · BTC ${pct(btc.pct_24h)} · 거래량 spike ${spikes}개`;
    }

    function renderMarketTable(data) {
      const rows = data.alts || [];
      if (!rows.length) {
        $('market-body').innerHTML = '<tr><td colspan="7" class="empty">마켓 데이터 없음</td></tr>';
        return;
      }
      $('market-body').innerHTML = rows.map(alt => `
        <tr class="${alt.worth_investing ? 'hot' : ''}">
          <td><span class="coin">${esc(alt.base || alt.symbol)}</span><span class="sub">${esc(alt.symbol)}</span></td>
          <td>${usd(alt.price)}</td>
          <td class="${tone(alt.pct_24h)}">${pct(alt.pct_24h)}</td>
          <td class="${tone(alt.funding_rate_pct)}">${pct(alt.funding_rate_pct)}</td>
          <td>${pill(alt.direction)}</td>
          <td>${recPill(alt)}</td>
          <td>${confidence(alt.confidence)}</td>
        </tr>
      `).join('');
    }

    function render(data) {
      renderPortfolio(data);
      renderPositions(data);
      renderHistory(data);
      renderMarketSummary(data);
      renderMarketTable(data);
      const status = data.health?.status;
      if (status) setLive(true, status === 'ok' ? 'Live' : `Live · ${status}`);
    }

    document.querySelectorAll('.tab-btn').forEach(button => {
      button.addEventListener('click', () => {
        const target = button.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn === button));
        document.querySelectorAll('.tab-page').forEach(page => page.classList.toggle('active', page.id === `tab-${target}`));
      });
    });

    async function loadInitial() {
      try {
        const response = await fetch('/api/alts');
        render(await response.json());
      } catch {
        setLive(false);
      }
    }

    function connectWs() {
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${protocol}://${location.host}/ws`);
      ws.onopen = () => setLive(true);
      ws.onmessage = event => {
        setLive(true);
        render(JSON.parse(event.data));
      };
      ws.onclose = () => {
        setLive(false);
        setTimeout(connectWs, 3000);
      };
      ws.onerror = () => setLive(false);
    }

    loadInitial();
    connectWs();
  </script>
</body>
</html>
