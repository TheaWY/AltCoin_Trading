<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AltCoin Trading</title>
  <style>
    :root {
      --bg: #05070b;
      --panel: #0f141c;
      --panel-2: #151b24;
      --line: #252d3a;
      --text: #eef3f8;
      --muted: #8a94a3;
      --up: #f04452;
      --down: #2878ff;
      --green: #2fd27d;
      --amber: #f0b84f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.35;
    }
    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 12px 12px 86px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .title { font-size: 18px; font-weight: 850; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--up);
    }
    .dot.live { background: var(--green); }
    .tab-page { display: none; }
    .tab-page.active { display: block; }
    .section { margin-bottom: 14px; }
    .section-title {
      margin: 0 0 8px 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .summary {
      padding: 16px 14px 14px;
      background: var(--panel-2);
    }
    .summary-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }
    .summary-total {
      margin-top: 3px;
      font-size: 30px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .summary-pnl {
      margin-top: 5px;
      font-size: 15px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
      border-top: 1px solid var(--line);
    }
    .metric {
      min-width: 0;
      padding: 11px 12px;
      background: var(--panel);
    }
    .metric-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .metric-value {
      margin-top: 4px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .market-line {
      padding: 13px 14px;
      font-weight: 850;
      color: #dfe7f0;
    }
    .scroll-table {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }
    .market-table { min-width: 700px; }
    th, td {
      padding: 10px 9px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    th {
      color: var(--muted);
      background: #0a0e14;
      font-size: 11px;
      font-weight: 850;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      text-align: left;
    }
    th:first-child { background: #0a0e14; }
    td:first-child { background: var(--panel); }
    tr.hot td { background: rgba(47,210,125,.08); }
    tr.hot td:first-child { background: #112119; }
    .coin { font-weight: 850; }
    .sub {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid transparent;
    }
    .pill.long { color: var(--up); background: rgba(240,68,82,.12); border-color: rgba(240,68,82,.22); }
    .pill.short { color: var(--down); background: rgba(40,120,255,.14); border-color: rgba(40,120,255,.24); }
    .pill.none, .pill.hold { color: var(--muted); background: rgba(138,148,163,.12); border-color: rgba(138,148,163,.22); }
    .pill.scalp { color: var(--amber); background: rgba(240,184,79,.13); border-color: rgba(240,184,79,.24); }
    .pill.swing { color: var(--green); background: rgba(47,210,125,.12); border-color: rgba(47,210,125,.22); }
    .pos { color: var(--up); }
    .neg { color: var(--down); }
    .muted { color: var(--muted); }
    .empty {
      padding: 18px;
      color: var(--muted);
      text-align: center;
    }

    /* --- Home (swing) cards --- */
    .card {
      border-bottom: 1px solid rgba(255,255,255,.06);
      padding: 12px 13px;
      /* offscreen cards are skipped by the renderer — critical at 500+ coins */
      content-visibility: auto;
      contain-intrinsic-size: auto 180px;
    }
    .more-btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: 0;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
    }
    .more-btn:active { color: var(--text); }
    .card:last-child { border-bottom: 0; }
    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-head .coin { font-size: 15px; }
    .card-price {
      margin-left: auto;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .card-price .sub { text-align: right; }
    .tag {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 5px;
      background: rgba(138,148,163,.12);
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 800;
    }
    .card-reason {
      margin-top: 7px;
      font-size: 13px;
      font-weight: 650;
      color: #d7e0ea;
    }
    .card-why {
      margin: 7px 0 0;
      padding-left: 16px;
      color: var(--muted);
      font-size: 12.5px;
    }
    .card-why li { margin-top: 3px; }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 9px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 8px;
      border-radius: 6px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .chip b { color: var(--text); font-weight: 800; }
    .chip b.pos { color: var(--up); }
    .chip b.neg { color: var(--down); }
    details.metric-details { margin-top: 8px; }
    details.metric-details summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 800;
      list-style: none;
      -webkit-user-select: none;
      user-select: none;
    }
    details.metric-details summary::before { content: "▸ "; }
    details.metric-details[open] summary::before { content: "▾ "; }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      margin-top: 8px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .metric-grid .metric { padding: 8px 10px; }
    .metric-grid .metric-label { font-size: 10.5px; }
    .metric-grid .metric-value { font-size: 12.5px; margin-top: 2px; }
    .home-summary {
      padding: 13px 14px;
      background: var(--panel-2);
      font-weight: 800;
      font-size: 13px;
    }
    .home-summary .muted { font-weight: 650; }
    .pnl-inline { font-weight: 800; font-variant-numeric: tabular-nums; }

    .bottom-tabs {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: 100%;
      max-width: 520px;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      background: rgba(5,7,11,.94);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .tab-btn {
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
    }
    .tab-btn.active {
      background: var(--panel-2);
      color: var(--text);
    }
    @media (max-width: 380px) {
      .app { padding-left: 10px; padding-right: 10px; }
      .summary-total { font-size: 25px; }
      th, td { padding-left: 7px; padding-right: 7px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="title">AltCoin Trading</div>
      <div class="status"><span class="dot" id="ws-dot"></span><span id="ws-text">연결 중</span></div>
    </div>

    <!-- ============ HOME: 단타/스윙 판단 ============ -->
    <section class="tab-page active" id="tab-home">
      <div class="section">
        <div class="panel home-summary" id="home-summary">데이터 대기 중</div>
      </div>

      <div class="section" id="home-positions-section" style="display:none">
        <div class="section-title">내 포지션</div>
        <div class="panel" id="home-positions"></div>
      </div>

      <div class="section">
        <div class="section-title">지금 진입 가능</div>
        <div class="panel" id="home-tradable">
          <div class="empty">평가 대기 중</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">대기 — 진입 조건 미충족</div>
        <div class="panel" id="home-waiting">
          <div class="empty">평가 대기 중</div>
        </div>
      </div>
    </section>

    <!-- ============ PORTFOLIO ============ -->
    <section class="tab-page" id="tab-portfolio">
      <div class="section">
        <div class="panel">
          <div class="summary">
            <div class="summary-label">총 평가금액</div>
            <div class="summary-total" id="total-value">—</div>
            <div class="summary-pnl" id="total-pnl">—</div>
          </div>
          <div class="metrics">
            <div class="metric">
              <div class="metric-label">보유 KRW</div>
              <div class="metric-value" id="cash-value">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">총 매수금액</div>
              <div class="metric-value" id="buy-amount">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">오픈 포지션</div>
              <div class="metric-value" id="open-count">—</div>
            </div>
            <div class="metric">
              <div class="metric-label">BTC 보유 대비</div>
              <div class="metric-value" id="btc-compare">—</div>
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Open Positions</div>
        <div class="panel scroll-table">
          <table>
            <thead>
              <tr>
                <th>코인</th>
                <th>방향</th>
                <th>매수평균</th>
                <th>현재가</th>
                <th>평가손익</th>
                <th>수익률</th>
              </tr>
            </thead>
            <tbody id="positions-body">
              <tr><td colspan="6" class="empty">오픈 포지션 없음</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Recent Closed Trades</div>
        <div class="panel scroll-table">
          <table>
            <thead>
              <tr>
                <th>코인</th>
                <th>방향</th>
                <th>진입가</th>
                <th>청산가</th>
                <th>수익률</th>
                <th>보유</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <tr><td colspan="6" class="empty">청산 내역 없음</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ============ MARKET ============ -->
    <section class="tab-page" id="tab-market">
      <div class="section">
        <div class="section-title">Market Summary</div>
        <div class="panel market-line" id="market-summary">데이터 대기 중</div>
      </div>
      <div class="section">
        <div class="section-title">All Symbols</div>
        <div class="panel scroll-table">
          <table class="market-table">
            <thead>
              <tr>
                <th>코인</th>
                <th>현재가</th>
                <th>24h</th>
                <th>펀딩비</th>
                <th>신호</th>
                <th>추천</th>
                <th>Conf</th>
              </tr>
            </thead>
            <tbody id="market-body">
              <tr><td colspan="7" class="empty">마켓 데이터 없음</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-tabs" aria-label="Dashboard tabs">
    <button class="tab-btn active" type="button" data-tab="home">홈</button>
    <button class="tab-btn" type="button" data-tab="portfolio">포트폴리오</button>
    <button class="tab-btn" type="button" data-tab="market">마켓</button>
  </nav>

  <script>
    const KRW_RATE = 1400;
    const $ = id => document.getElementById(id);
    const num = value => Number(value ?? 0);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
    const krw = value => value == null ? '—' : '₩' + Math.round(num(value) * KRW_RATE).toLocaleString('ko-KR');
    const usd = value => value == null ? '—' : '$' + num(value).toLocaleString(undefined, { maximumFractionDigits: value >= 10 ? 2 : 4 });
    const pct = value => value == null ? '—' : `${num(value) >= 0 ? '+' : ''}${num(value).toFixed(2)}%`;
    const tone = value => num(value) > 0 ? 'pos' : num(value) < 0 ? 'neg' : 'muted';
    const confidence = value => value == null ? '—' : Math.round(num(value) * 100) + '%';
    const fx = (value, digits = 1) => value == null ? '—' : num(value).toFixed(digits);

    function setLive(isLive, label) {
      $('ws-dot').className = 'dot' + (isLive ? ' live' : '');
      $('ws-text').textContent = label || (isLive ? 'Live' : 'Offline');
    }

    function pill(value) {
      const text = value || 'NONE';
      return `<span class="pill ${text.toLowerCase()}">${esc(text)}</span>`;
    }

    function stylePill(style) {
      if (style === '단타') return '<span class="pill scalp">단타</span>';
      if (style === '스윙') return '<span class="pill swing">스윙</span>';
      return '<span class="pill hold">대기</span>';
    }

    function recPill(alt) {
      if (!alt.worth_investing || !alt.recommended_style) {
        return '<span class="pill hold">HOLD</span>';
      }
      const isShort = alt.recommended_style === 'short_term';
      return `<span class="pill ${isShort ? 'scalp' : 'swing'}">${isShort ? '단타' : '스윙'}</span>`;
    }

    // ---------- HOME ----------

    function chip(label, value, cls = '') {
      return `<span class="chip">${esc(label)} <b class="${cls}">${esc(value)}</b></span>`;
    }

    function keyChips(m) {
      const dv = m.dollar_volume_24h;
      return [
        chip('RSI', fx(m.rsi_14, 0)),
        chip('ATR', fx(m.atr_pct, 2) + '%'),
        chip('펀딩', m.funding_rate_pct == null ? '—' : pct(m.funding_rate_pct), tone(m.funding_rate_pct)),
        chip('7d', pct(m.pct_7d), tone(m.pct_7d)),
        chip('BTC상관', fx(m.btc_correlation, 2)),
        chip('거래대금', dv == null ? '—' : '$' + (dv / 1e6).toFixed(0) + 'M'),
      ].join('');
    }

    function metricGridRows(m) {
      return [
        ['24h 수익률', pct(m.pct_24h), tone(m.pct_24h)],
        ['7d 수익률', pct(m.pct_7d), tone(m.pct_7d)],
        ['30d 수익률', pct(m.pct_30d), tone(m.pct_30d)],
        ['RSI(14)', fx(m.rsi_14, 0)],
        ['ATR (1h)', fx(m.atr_pct, 2) + '%'],
        ['변동성 7d (연율)', fx(m.realized_vol_7d, 0) + '%'],
        ['변동성 30d (연율)', fx(m.realized_vol_30d, 0) + '%'],
        ['Sharpe 7d', fx(m.sharpe_7d, 1)],
        ['Sharpe 30d', fx(m.sharpe_30d, 1)],
        ['최대낙폭 30d', m.max_drawdown_30d == null ? '—' : '-' + fx(m.max_drawdown_30d, 1) + '%'],
        ['BTC 상관 (30d)', fx(m.btc_correlation, 2)],
        ['BTC 베타', fx(m.btc_beta, 2)],
        ['Amihud 비유동성', fx(m.amihud_illiq, 2)],
        ['거래대금 24h', m.dollar_volume_24h == null ? '—' : '$' + (m.dollar_volume_24h / 1e6).toFixed(1) + 'M'],
        ['거래량 배율', m.volume_ratio == null ? '—' : fx(m.volume_ratio, 1) + 'x'],
        ['30d 고점 대비', pct(m.from_high_30d_pct), tone(m.from_high_30d_pct)],
        ['30d 저점 대비', pct(m.from_low_30d_pct), tone(m.from_low_30d_pct)],
        ['볼린저 %B', m.bollinger ? fx(m.bollinger.percent_b, 2) : '—'],
        ['MACD hist', m.macd ? fx(m.macd.hist_pct, 3) + '%' : '—'],
        ['펀딩비', m.funding_rate_pct == null ? '—' : pct(m.funding_rate_pct), tone(m.funding_rate_pct)],
      ];
    }

    // Metric grids are built only when a card's details element is opened —
    // rendering 20 hidden cells x 500+ coins up front crashes mobile Chrome.
    const metricsBySymbol = new Map();

    function metricDetails(entry) {
      return `
        <details class="metric-details" data-symbol="${esc(entry.symbol)}">
          <summary>전체 지표 보기</summary>
          <div class="metric-grid"></div>
        </details>
      `;
    }

    document.addEventListener('toggle', event => {
      const details = event.target;
      if (!details.classList?.contains('metric-details') || !details.open) return;
      const grid = details.querySelector('.metric-grid');
      if (grid.childElementCount) return;
      const m = metricsBySymbol.get(details.dataset.symbol);
      if (!m) return;
      grid.innerHTML = metricGridRows(m).map(([label, value, cls]) => `
        <div class="metric">
          <div class="metric-label">${esc(label)}</div>
          <div class="metric-value ${cls || ''}">${esc(value)}</div>
        </div>
      `).join('');
    }, true);

    function evalCard(entry, { showWhy = false } = {}) {
      const m = entry.metrics || {};
      const v = entry.verdict;
      const inv = entry.investment || {};
      const invested = entry.has_position;
      const pnlPct = inv.unrealized_pnl_pct;
      const head = `
        <div class="card-head">
          <span class="coin">${esc(entry.base)}</span>
          ${invested ? pill(inv.direction) : ''}
          ${v ? stylePill(v.style) : (showWhy ? stylePill(null) : '')}
          ${v ? pill(v.direction) : ''}
          ${v ? `<span class="tag">${esc(v.strategy)}</span>` : ''}
          <span class="card-price">
            ${usd(m.last_price)}
            <span class="sub ${tone(m.pct_24h)}">${pct(m.pct_24h)} (24h)</span>
          </span>
        </div>
      `;
      const investedLine = invested ? `
        <div class="card-reason">
          보유중 · 진입 ${usd(inv.entry_price)} →
          <span class="pnl-inline ${tone(pnlPct)}">${pct(pnlPct)}</span>
          ${v ? '· 신규 신호: ' + esc(v.reason) : '· 현재 신규 신호 없음 (아래 이유)'}
        </div>
      ` : '';
      const reason = (!invested && v) ? `<div class="card-reason">${esc(v.reason)}</div>` : '';
      const why = (showWhy && (entry.why_not || []).length) ? `
        <ul class="card-why">
          ${entry.why_not.map(r => `<li>${esc(r)}</li>`).join('')}
        </ul>
      ` : '';
      return `
        <div class="card">
          ${head}
          ${investedLine}
          ${reason}
          ${why}
          <div class="chips">${keyChips(m)}</div>
          ${metricDetails(entry)}
        </div>
      `;
    }

    // Incremental rendering: show PAGE_SIZE cards per section, load more on tap.
    const PAGE_SIZE = 30;
    const shown = { tradable: PAGE_SIZE, waiting: PAGE_SIZE, market: 100 };
    let lastData = null;

    function renderSection(el, entries, count, key, opts) {
      const visible = entries.slice(0, count);
      let html = visible.map(e => evalCard(e, opts)).join('');
      if (entries.length > count) {
        html += `<button class="more-btn" type="button" data-more="${key}">더 보기 (${entries.length - count}개 남음)</button>`;
      }
      el.innerHTML = html;
    }

    function renderHome(data) {
      const evaluation = data.evaluation || [];
      if (!evaluation.length) return;

      metricsBySymbol.clear();
      evaluation.forEach(e => metricsBySymbol.set(e.symbol, e.metrics || {}));

      const invested = evaluation.filter(e => e.has_position);
      const tradable = evaluation.filter(e => !e.has_position && e.tradable);
      const waiting = evaluation.filter(e => !e.has_position && !e.tradable);

      const scalps = evaluation.filter(e => e.verdict?.style === '단타').length;
      const swings = evaluation.filter(e => e.verdict?.style === '스윙').length;
      $('home-summary').innerHTML =
        `지금 진입 가능 <b>${tradable.length + invested.filter(e => e.tradable).length}</b>/${evaluation.length}` +
        ` <span class="muted">· 단타 ${scalps} · 스윙 ${swings} · 보유 ${invested.length}</span>`;

      const posSection = $('home-positions-section');
      if (invested.length) {
        posSection.style.display = '';
        $('home-positions').innerHTML = invested.map(e => evalCard(e, { showWhy: false })).join('');
      } else {
        posSection.style.display = 'none';
      }

      if (tradable.length) {
        renderSection($('home-tradable'), tradable, shown.tradable, 'tradable');
      } else {
        $('home-tradable').innerHTML = '<div class="empty">지금 진입할 만한 셋업 없음 — 아래 이유 참고</div>';
      }

      if (waiting.length) {
        renderSection($('home-waiting'), waiting, shown.waiting, 'waiting', { showWhy: true });
      } else {
        $('home-waiting').innerHTML = '<div class="empty">모든 코인 진입 가능</div>';
      }
    }

    document.addEventListener('click', event => {
      const key = event.target?.dataset?.more;
      if (!key || !lastData) return;
      shown[key] += key === 'market' ? 200 : 60;
      if (key === 'market') renderMarketTable(lastData);
      else renderHome(lastData);
    });

    // ---------- PORTFOLIO ----------

    function renderPortfolio(data) {
      const p = data.portfolio || {};
      const start = p.starting_capital ?? 0;
      const value = p.paper_value ?? null;
      const pnl = p.pnl_vs_start ?? (value == null ? null : value - start);
      const pnlPct = start ? pnl / start * 100 : null;
      const btcHold = p.buy_and_hold_value ?? null;
      const btcDiff = p.pnl_vs_buy_hold ?? (value != null && btcHold != null ? value - btcHold : null);
      const btcDiffPct = btcHold ? btcDiff / btcHold * 100 : null;

      $('total-value').textContent = krw(value);
      $('total-pnl').className = 'summary-pnl ' + tone(pnl);
      $('total-pnl').textContent = `${pct(pnlPct)} · ${krw(pnl)} 평가손익`;
      $('cash-value').textContent = krw(p.cash);
      $('buy-amount').textContent = krw(p.total_invested_open);
      $('open-count').textContent = `${p.open_trades ?? 0} / ${p.max_open_positions ?? '—'}`;
      $('btc-compare').className = 'metric-value ' + tone(btcDiff);
      $('btc-compare').textContent = btcDiff == null ? '—' : `${pct(btcDiffPct)} · ${krw(btcDiff)}`;
    }

    function renderPositions(data) {
      const rows = (data.alts || []).filter(alt => alt.investment?.status === 'open');
      if (!rows.length) {
        $('positions-body').innerHTML = '<tr><td colspan="6" class="empty">오픈 포지션 없음</td></tr>';
        return;
      }
      $('positions-body').innerHTML = rows.map(alt => {
        const inv = alt.investment || {};
        return `
          <tr>
            <td><span class="coin">${esc(alt.base || alt.symbol)}</span><span class="sub">${esc(alt.symbol)}</span></td>
            <td>${pill(inv.direction)}</td>
            <td>${usd(inv.entry_price)}</td>
            <td>${usd(inv.current_price ?? alt.price)}</td>
            <td class="${tone(inv.unrealized_pnl)}">${krw(inv.unrealized_pnl)}</td>
            <td class="${tone(inv.unrealized_pnl_pct)}">${pct(inv.unrealized_pnl_pct)}</td>
          </tr>
        `;
      }).join('');
    }

    function tradeReturn(trade) {
      const notional = num(trade.entry_price) * num(trade.quantity);
      return notional ? num(trade.pnl) / notional * 100 : null;
    }

    function holdTime(trade) {
      if (!trade.opened_at || !trade.closed_at) return '—';
      const hours = Math.max(0, num(trade.closed_at) - num(trade.opened_at)) / 3600;
      return hours < 24 ? `${hours.toFixed(1)}h` : `${(hours / 24).toFixed(1)}d`;
    }

    function renderHistory(data) {
      const trades = (data.closed_trades || data.recent_trades || [])
        .filter(trade => trade.status === 'closed')
        .sort((a, b) => num(b.closed_at) - num(a.closed_at))
        .slice(0, 20);
      if (!trades.length) {
        $('history-body').innerHTML = '<tr><td colspan="6" class="empty">청산 내역 없음</td></tr>';
        return;
      }
      $('history-body').innerHTML = trades.map(trade => {
        const ret = tradeReturn(trade);
        return `
          <tr>
            <td><span class="coin">${esc((trade.symbol || '').split('/')[0])}</span></td>
            <td>${pill(trade.direction)}</td>
            <td>${usd(trade.entry_price)}</td>
            <td>${usd(trade.exit_price)}</td>
            <td class="${tone(ret)}">${pct(ret)}</td>
            <td>${holdTime(trade)}</td>
          </tr>
        `;
      }).join('');
    }

    // ---------- MARKET ----------

    function renderMarketSummary(data) {
      const alts = data.alts || [];
      const positive = alts.filter(alt => num(alt.funding_rate) > 0).length;
      const negative = alts.filter(alt => num(alt.funding_rate) < 0).length;
      const bias = positive > negative ? '롱 우세' : negative > positive ? '숏 우세' : '중립';
      const btc = alts.find(alt => alt.symbol === 'BTC/USDT') || {};
      const spikes = alts.filter(alt => alt.volume_spike).length;
      $('market-summary').textContent = `${bias} ${positive}/${alts.length} · BTC ${pct(btc.pct_24h)} · 거래량 spike ${spikes}개`;
    }

    function renderMarketTable(data) {
      const rows = data.alts || [];
      if (!rows.length) {
        $('market-body').innerHTML = '<tr><td colspan="7" class="empty">마켓 데이터 없음</td></tr>';
        return;
      }
      let html = rows.slice(0, shown.market).map(alt => `
        <tr class="${alt.worth_investing ? 'hot' : ''}">
          <td><span class="coin">${esc(alt.base || alt.symbol)}</span><span class="sub">${esc(alt.symbol)}</span></td>
          <td>${usd(alt.price)}</td>
          <td class="${tone(alt.pct_24h)}">${pct(alt.pct_24h)}</td>
          <td class="${tone(alt.funding_rate_pct)}">${pct(alt.funding_rate_pct)}</td>
          <td>${pill(alt.direction)}</td>
          <td>${recPill(alt)}</td>
          <td>${confidence(alt.confidence)}</td>
        </tr>
      `).join('');
      if (rows.length > shown.market) {
        html += `<tr><td colspan="7" style="padding:0"><button class="more-btn" type="button" data-more="market">더 보기 (${rows.length - shown.market}개 남음)</button></td></tr>`;
      }
      $('market-body').innerHTML = html;
    }

    function render(data) {
      lastData = data;
      renderHome(data);
      renderPortfolio(data);
      renderPositions(data);
      renderHistory(data);
      renderMarketSummary(data);
      renderMarketTable(data);
      const status = data.health?.status;
      if (status) setLive(true, status === 'ok' ? 'Live' : `Live · ${status}`);
    }

    document.querySelectorAll('.tab-btn').forEach(button => {
      button.addEventListener('click', () => {
        const target = button.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn === button));
        document.querySelectorAll('.tab-page').forEach(page => page.classList.toggle('active', page.id === `tab-${target}`));
      });
    });

    async function loadInitial() {
      try {
        const response = await fetch('/api/alts');
        render(await response.json());
      } catch {
        setLive(false);
      }
    }

    function connectWs() {
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${protocol}://${location.host}/ws`);
      ws.onopen = () => setLive(true);
      ws.onmessage = event => {
        setLive(true);
        render(JSON.parse(event.data));
      };
      ws.onclose = () => {
        setLive(false);
        setTimeout(connectWs, 3000);
      };
      ws.onerror = () => setLive(false);
    }

    loadInitial();
    connectWs();
  </script>
</body>
</html>
