# Hypothesis space for the nightly research runner.
# Each key must be a whitelisted config env var (see promotion.py prefixes).
# Values are EXPLICIT candidate lists — no continuous ranges, so every combo
# is enumerable, hashable, and reproducible.
#
# 사람이 하는 일: 여기에 축을 추가/수정하는 것. 나머지는 자동.
# 새 축을 추가하기 전에 이벤트 스터디(event_study.py) 통과 여부부터 확인할 것.

axes:
  ACTIVE_STRATEGY: [rel_strength_rotation, momentum, volume_spike, mean_reversion, funding_rate]
  ALLOW_LONG: [true, false]
  CATEGORY_STRATEGY_MODE: ["off", "matched"]

  # setup on/off toggles. Defaults now reflect the last backtest weakness:
  # start with fewer, cleaner hypotheses; re-enable noisy branches only if they
  # survive walk-forward + fresh-data promotion.
  SETUP_MEANREV_ENABLED: [true, false]
  SETUP_BREAKOUT_ENABLED: [false, true]
  SETUP_TSMOM_ENABLED: [false, true]
  SETUP_VOLUME_ENABLED: [false, true]
  SETUP_FUNDING_ENABLED: [true]
  # Failed pump short: catches coins that ran hard over 7d and then roll over
  # intraday with structure break. Added after dashboard review of SKL-like cases.
  SETUP_FAILED_PUMP_ENABLED: [true, false]

  # Axes below are proven live in scripts/run_backtest_once.py A/B probes.
  # Setup/confluence knobs are intentionally absent until a strategy path
  # demonstrates outcome sensitivity to them.
  MIN_CONFIDENCE: [0.70, 0.75, 0.80]
  COOLDOWN_HOURS_PER_SYMBOL: [24, 48, 72]

  # fee model assumption. Maker is only a research scenario until maker-fill
  # simulation exists; taker remains the conservative default.
  FEE_MODE: ["taker", "maker"]

# Hypothesis families to prioritize first (partial configs; generator boosts
# priority of any combo matching all listed key/values).
priority_families:
  # Top priority per user decision 2026-07-13: event_study.py round 2 found
  # the only signal with a real, regime-consistent, CI-clean effect (n=529/530,
  # +1.46%/+2.88% at 24h/72h). LONG-only by construction (ALLOW_LONG:false
  # produces zero possible trades for this strategy) -- listed first so those
  # configs rank ahead of the direction-incompatible ALLOW_LONG:false ones,
  # which still get queued (for completeness) but sink to whatever priority
  # the second, unqualified entry below gives them.
  - name: "rel_strength_rotation_long"
    match: { ACTIVE_STRATEGY: rel_strength_rotation, ALLOW_LONG: true }
  - name: "rel_strength_rotation_any"
    match: { ACTIVE_STRATEGY: rel_strength_rotation }
  - name: "category_strategy_momentum"
    match: { CATEGORY_STRATEGY_MODE: "matched", ACTIVE_STRATEGY: momentum }
  - name: "category_strategy_mean_reversion"
    match: { CATEGORY_STRATEGY_MODE: "matched", ACTIVE_STRATEGY: mean_reversion }
  - name: "strategy_momentum"
    match: { ACTIVE_STRATEGY: momentum }
  - name: "strategy_volume_spike"
    match: { ACTIVE_STRATEGY: volume_spike }
  - name: "strategy_mean_reversion"
    match: { ACTIVE_STRATEGY: mean_reversion }
  - name: "conservative_core"
    match:
      SETUP_BREAKOUT_ENABLED: false
      SETUP_TSMOM_ENABLED: false
      SETUP_VOLUME_ENABLED: false
      SETUP_FAILED_PUMP_ENABLED: true
      MIN_CONFIDENCE: 0.70
      COOLDOWN_HOURS_PER_SYMBOL: 48
      FEE_MODE: "taker"
  - name: "failed_pump_short_check"
    match: { SETUP_FAILED_PUMP_ENABLED: true, SETUP_VOLUME_ENABLED: false, FEE_MODE: "taker" }
  - name: "no_breakout_no_tsmom"
    match: { SETUP_BREAKOUT_ENABLED: false, SETUP_TSMOM_ENABLED: false }
  - name: "fewer_trades"
    match: { COOLDOWN_HOURS_PER_SYMBOL: 72, MIN_CONFIDENCE: 0.80 }
  - name: "maker_fees_sensitivity_only"
    match: { FEE_MODE: "maker" }

limits:
  max_new_per_run: 300     # newly queued combos per generator invocation
